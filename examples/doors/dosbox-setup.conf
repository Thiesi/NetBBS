# MANUAL SYSOP SETUP ONLY. Copy and edit mount c before running DOSBox-X.
# Requires a local graphical desktop/X display; runtime play is headless.
# Mount only a disposable or backed-up game directory, NEVER the NetBBS state.
[sdl]
fullscreen=false
output=surface
autolock=false
waitonerror=false
[dosbox]
memsize=16
[cpu]
core=normal
cycles=fixed 10000
[mixer]
nosound=true
[midi]
mpu401=none
mididevice=none
[serial]
serial1=disabled
serial2=disabled
serial3=disabled
serial4=disabled
[parallel]
parallel1=disabled
parallel2=disabled
parallel3=disabled
[ipx]
ipx=false
[ne2000]
ne2000=false
[autoexec]
mount c "/REPLACE/WITH/GAME/INSTALLATION"
c:
config -securemode
# LORD: LORDCFG.EXE
# TradeWars first install ONLY: INSTALL.BAT (initializes a universe)
# TradeWars later node configuration: TEDIT.EXE
# Global War: edit WAR.CFG on the host; see the door guide.
