; MANUAL alternative to SSH; requires a provider which actually offers TLS RLogin.
; Edit host, port, CA path, and certificate name. Never turn verification off.
foreground = yes
client = yes
[netbbs-door]
accept = 127.0.0.1:1513
connect = REPLACE_WITH_TLS_PROVIDER:5513
verifyChain = yes
CAfile = /etc/openssl/certs/ca-certificates.crt
checkHost = REPLACE_WITH_TLS_PROVIDER
sni = REPLACE_WITH_TLS_PROVIDER
